<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trustfall XR TEST HARNESS (IWER emulated Quest 3)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;background:#060b16;color:#cfe8ff;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}
  #hud{position:fixed;left:16px;bottom:16px;max-width:430px;font-size:13px;line-height:1.45;background:rgba(6,11,22,.82);
       border:1px solid #1b3a52;border-radius:10px;padding:10px 14px;z-index:5}
  #hud b{color:#22d3ee}
  #hud .warn{color:#f5a524}
  body.shot #hud{display:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:#060b16;z-index:9}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <b>TRUSTFALL</b> &mdash; AgentOps Command Center<br>
  <span id="mode">Desktop preview: mouse click is a <span class="warn">development stand-in only</span>, not hand tracking.</span><br>
  On Meta Quest: use <b>Enter VR</b>, then pinch or poke with your hands (hand tracking enabled in Quest settings).
</div>
<div id="err"></div>
<script src="https://cdn.jsdelivr.net/npm/iwer@2.8.0/build/iwer.min.js"></script>
<script>var d=new IWER.XRDevice(IWER.metaQuest3);d.installRuntime({forceInstall:true});d.primaryInputMode="hand";window.__dev=d;</script>
<script src="src/engine.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
